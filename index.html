<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tsunami UBG | HTML Games Showcase</title>
  
  <style>
    /* ==========================================================================
       TSUNAMI UBG - OCEAN DESIGN SYSTEM & THEME VARIABLES
       ========================================================================== */
    :root {
      --bg-dark: #040914;
      --bg-navy: #0a1428;
      --bg-card: rgba(12, 26, 50, 0.65);
      --bg-card-hover: rgba(18, 38, 72, 0.85);
      --glass-border: rgba(0, 242, 254, 0.18);
      --glass-border-glow: rgba(0, 242, 254, 0.5);
      
      --cyan-bright: #00f2fe;
      --aqua-blue: #4facfe;
      --ocean-deep: #003366;
      --water-pale: #e0f7fa;
      
      --text-main: #f0f8ff;
      --text-muted: #8aa4ca;
      --accent-glow: 0 0 25px rgba(0, 242, 254, 0.35);
      --card-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      
      --font-family: 'Comic Sans MS', 'Comic Sans', cursive, sans-serif;
      --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(79, 172, 254, 0.05) 0%, transparent 40%);
    }

    /* ==========================================================================
       1. NAVIGATION BAR
       ========================================================================== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(4, 9, 20, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 1px;
    }

    .nav-brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--cyan-bright), var(--aqua-blue));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--accent-glow);
    }

    .nav-brand-logo svg {
      width: 22px;
      height: 22px;
      fill: var(--bg-dark);
    }

    .nav-brand-text {
      background: linear-gradient(90deg, #ffffff, var(--cyan-bright));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      list-style: none;
    }

    .nav-link {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
      padding: 6px 12px;
      border-radius: 8px;
      transition: var(--transition-smooth);
      cursor: pointer;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--cyan-bright);
      background: rgba(0, 242, 254, 0.08);
    }

    .nav-search {
      position: relative;
      width: 240px;
    }

    .nav-search input {
      width: 100%;
      padding: 8px 14px 8px 36px;
      background: rgba(10, 20, 40, 0.8);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 0.88rem;
      outline: none;
      transition: var(--transition-smooth);
    }

    .nav-search input:focus {
      border-color: var(--cyan-bright);
      box-shadow: var(--accent-glow);
      width: 280px;
    }

    .nav-search svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    /* ==========================================================================
       2. HERO SECTION WITH CANVAS WAVE ANIMATION
       ========================================================================== */
    .hero-container {
      position: relative;
      width: 100%;
      height: 65vh;
      min-height: 420px;
      max-height: 600px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--glass-border);
      background: linear-gradient(180deg, #020612 0%, #081830 100%);
    }

    #wave-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(4, 9, 20, 0.2) 0%, rgba(4, 9, 20, 0.75) 100%);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 20px;
      max-width: 800px;
    }

    .hero-title {
      font-size: clamp(2.8rem, 7vw, 5.2rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 
        0 0 10px rgba(0, 242, 254, 0.8),
        0 0 25px rgba(0, 242, 254, 0.5),
        0 0 50px rgba(79, 172, 254, 0.3),
        2px 2px 4px rgba(0, 0, 0, 0.9);
      -webkit-text-stroke: 1px rgba(224, 247, 250, 0.6);
      margin-bottom: 12px;
      animation: pulseGlow 4s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px rgba(0, 242, 254, 0.6), 0 0 20px rgba(0, 242, 254, 0.3); }
      100% { text-shadow: 0 0 20px rgba(0, 242, 254, 0.9), 0 0 40px rgba(79, 172, 254, 0.7); }
    }

    .hero-tagline {
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      color: var(--water-pale);
      letter-spacing: 1.5px;
      margin-bottom: 28px;
      font-weight: 300;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .hero-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      background: linear-gradient(135deg, var(--cyan-bright), var(--aqua-blue));
      color: var(--bg-dark);
      font-family: var(--font-family);
      font-weight: 700;
      font-size: 1.05rem;
      text-decoration: none;
      border-radius: 30px;
      box-shadow: var(--accent-glow), 0 8px 20px rgba(0,0,0,0.4);
      transition: var(--transition-smooth);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .hero-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.85);
      background: linear-gradient(135deg, #26f5ff, #62b5fe);
    }

    .suggest-btn {
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      color: #ffffff;
      box-shadow: 0 0 25px rgba(124, 58, 237, 0.6), 0 8px 20px rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .suggest-btn:hover {
      background: linear-gradient(135deg, #8b5cf6, #2563eb);
      box-shadow: 0 0 35px rgba(139, 92, 246, 0.9);
      transform: translateY(-3px) scale(1.03);
    }

    /* ==========================================================================
       3. MAIN LAYOUT & CONTROLS
       ========================================================================== */
    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 40px 24px;
      flex: 1;
      width: 100%;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 22px;
      background: var(--cyan-bright);
      border-radius: 2px;
      box-shadow: var(--accent-glow);
    }

    .view-tabs {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 24px;
      padding-bottom: 8px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-family);
      font-size: 1rem;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      transition: var(--transition-smooth);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      color: var(--cyan-bright);
      background: rgba(0, 242, 254, 0.1);
    }

    /* ==========================================================================
       4. CONTENT LIBRARY GRID & CARDS
       ========================================================================== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition-smooth);
      position: relative;
      box-shadow: var(--card-shadow);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--glass-border-glow);
      background: var(--bg-card-hover);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), var(--accent-glow);
    }

    .card-thumbnail-wrapper {
      position: relative;
      width: 100%;
      height: 160px;
      background: linear-gradient(135deg, #091a34, #002b4d);
      overflow: hidden;
    }

    .card-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .card-thumbnail {
      transform: scale(1.06);
    }

    .card-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #0d2a4a 0%, #051326 100%);
      color: var(--cyan-bright);
      opacity: 0.8;
    }

    .card-placeholder svg {
      width: 48px;
      height: 48px;
      fill: currentColor;
    }

    .card-fav-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(4, 9, 20, 0.75);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
    }

    .card-fav-btn:hover, .card-fav-btn.is-favorite {
      color: #ff4757;
      border-color: rgba(255, 71, 87, 0.5);
      background: rgba(4, 9, 20, 0.9);
    }

    .card-fav-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-description {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 18px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-play-btn {
      width: 100%;
      padding: 10px;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid var(--glass-border);
      color: var(--cyan-bright);
      font-family: var(--font-family);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition-smooth);
    }

    .card-play-btn:hover {
      background: var(--cyan-bright);
      color: var(--bg-dark);
      box-shadow: var(--accent-glow);
    }

    .card-play-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-card);
      border: 1px dashed var(--glass-border);
      border-radius: 16px;
    }

    .empty-state svg {
      width: 60px;
      height: 60px;
      fill: var(--text-muted);
      margin-bottom: 16px;
      opacity: 0.6;
    }

    .empty-state h3 {
      font-size: 1.25rem;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* ==========================================================================
       5. PROJECT VIEWER (MODAL & IFRAME)
       ========================================================================== */
    .viewer-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 7, 16, 0.95);
      backdrop-filter: blur(20px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .viewer-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .viewer-header {
      padding: 12px 24px;
      background: rgba(6, 15, 30, 0.9);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .viewer-title-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .viewer-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .viewer-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .viewer-btn {
      background: rgba(15, 30, 55, 0.8);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      font-family: var(--font-family);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: var(--transition-smooth);
    }

    .viewer-btn:hover {
      background: rgba(0, 242, 254, 0.2);
      border-color: var(--cyan-bright);
      color: var(--cyan-bright);
    }

    .viewer-btn.close-btn {
      background: rgba(255, 71, 87, 0.15);
      border-color: rgba(255, 71, 87, 0.3);
      color: #ff4757;
    }

    .viewer-btn.close-btn:hover {
      background: #ff4757;
      color: #ffffff;
    }

    .viewer-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .viewer-body {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 60px);
      background: #000;
    }

    .viewer-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    .viewer-error {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      display: none;
    }

    .viewer-error svg {
      width: 64px;
      height: 64px;
      fill: var(--cyan-bright);
      margin-bottom: 16px;
    }

    .viewer-error h3 {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    .viewer-error p {
      color: var(--text-muted);
      max-width: 500px;
      line-height: 1.5;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    /* ==========================================================================
       6. FOOTER
       ========================================================================== */
    .footer {
      background: rgba(2, 6, 14, 0.95);
      border-top: 1px solid var(--glass-border);
      padding: 40px 24px 24px 24px;
      margin-top: auto;
    }

    .footer-content {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 30px;
    }

    .footer-brand h2 {
      font-size: 1.3rem;
      color: var(--cyan-bright);
      margin-bottom: 8px;
    }

    .footer-brand p {
      color: var(--text-muted);
      font-size: 0.88rem;
      max-width: 320px;
      line-height: 1.5;
    }

    .footer-links-group {
      display: flex;
      gap: 40px;
    }

    .footer-column h4 {
      font-size: 0.95rem;
      color: var(--text-main);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .footer-column ul {
      list-style: none;
    }

    .footer-column li {
      margin-bottom: 8px;
    }

    .footer-column a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      transition: var(--transition-smooth);
    }

    .footer-column a:hover {
      color: var(--cyan-bright);
    }

    .footer-bottom {
      max-width: 1320px;
      margin: 0 auto;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 12px 16px;
      }
      .nav-links {
        display: none;
      }
      .nav-search {
        width: 160px;
      }
      .nav-search input:focus {
        width: 180px;
      }
      .hero-container {
        height: 50vh;
      }
      .container {
        padding: 24px 16px;
      }
      .view-tabs {
        overflow-x: auto;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION BAR -->
  <nav class="navbar">
    <a href="#" class="nav-brand" onclick="switchTab('all')">
      <!-- WAVE ART LOGO ICON -->
      <div class="nav-brand-logo">
        <svg viewBox="0 0 24 24">
          <path d="M2 16.5c3 0 4.5-2 7.5-2s4.5 2 7.5 2 4.5-2 7-2v2.5c-2.5 0-4 2-7 2s-4.5-2-7.5-2-4.5 2-7.5 2H2v-3zm0-6c3 0 4.5-2 7.5-2s4.5 2 7.5 2 4.5-2 7-2v2.5c-2.5 0-4 2-7 2s-4.5-2-7.5-2-4.5 2-7.5 2H2v-3z"/>
        </svg>
      </div>
      <span class="nav-brand-text">TSUNAMI UBG</span>
    </a>

    <ul class="nav-links">
      <li><a class="nav-link active" onclick="switchTab('all')">Home</a></li>
      <li><a class="nav-link" onclick="switchTab('all')">Games</a></li>
      <li><a class="nav-link" onclick="switchTab('favorites')">Favorites</a></li>
    </ul>

    <div class="nav-search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="searchInput" placeholder="Search games..." oninput="handleSearch()" />
    </div>
  </nav>

  <!-- HERO SECTION WITH CANVAS WAVE ANIMATION -->
  <header class="hero-container">
    <canvas id="wave-canvas"></canvas>
    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1 class="hero-title">TSUNAMI UBG</h1>
      <p class="hero-tagline">Dive Into Something Different</p>
      <div class="hero-buttons">
        <a href="#library" class="hero-btn">
          <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Explore Library
        </a>
        <a href="https://forms.gle/jP3pSGjKttLEenXj7" target="_blank" rel="noopener noreferrer" class="hero-btn suggest-btn">
          <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          Suggest a Game
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="container" id="library">
